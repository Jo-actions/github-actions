name : Inputs demo
on: 
  workflow_disptach:
    inputs:
      logLevel: 
        description: 'Log Level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
      tags:
       description: 'Test Scenario tags'
       required: false
       type: boolean
     

jobs:
  trigger:
    runs-on: ubunt-latest
    steps:
     - name: print inputs
       run: |
        echo "Log level: ${{ inputs.logLevel }}"
        echo "Tags: ${{ inputs.tags }}"
